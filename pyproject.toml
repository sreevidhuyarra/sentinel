[project]
name = "sentinel"
version = "0.1.0"
description = "AI-powered threat detection and response platform (local-first SOC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.8",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera[polars]>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
    # Module 1: supervised IDS
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "torch>=2.4",
    "optuna>=4.0",
    "imbalanced-learn>=0.12",
    "mlflow>=2.16",
    "matplotlib>=3.9",
    # Module 3: phishing classifier
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "onnx>=1.16",
    "onnxscript>=0.3",
    "onnxruntime>=1.19",
    # Serving
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# CPU-only PyTorch everywhere (the default Linux wheel pulls ~2 GB of CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "dvc>=3.55",
    "pandas-stubs",
    "types-PyYAML",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# X / X_val for feature matrices is the scikit-learn convention.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Notebook sources import per cell, after the pip-install cell.
"notebooks/*.py" = ["E402"]
# Markdown table rows are long by nature.
"src/sentinel/*/report.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["sentinel"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that need the real dataset (skipped in CI)",
]
