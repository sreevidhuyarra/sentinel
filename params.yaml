# Single source of pipeline parameters. DVC tracks changes to these keys;
# src/sentinel/common/config.py loads and validates them with Pydantic.

seed: 42

data:
  raw_dir: data/raw/cicids2017
  interim_dir: data/interim
  processed_dir: data/processed
  reference_dir: data/reference
  reports_dir: reports
  # How to treat the corrected release's "X - Attempted" flows (attack attempts
  # that carried no malicious payload): benign | drop | keep
  attempted_policy: benign
  # Fraction of rows kept when building the dev sample (make data-sample).
  dev_sample_frac: 0.1

split:
  # Chronological split applied separately inside every (day, label) group so
  # each attack campaign contributes early flows to train and later flows to test.
  train_frac: 0.6
  val_frac: 0.2
  # Rows discarded at each boundary so near-duplicate neighbouring flows of
  # one session don't straddle two splits.
  gap_rows: 50
  # Families removed from supervised training, one at a time, to score the
  # anomaly detector on attacks it has never seen (module 2).
  holdout_families: [Infiltration, Bot, WebAttack]

features:
  log_transform: true
  drop_constant: true

ids:
  # Decision rule: flag a flow as an attack only if it keeps benign FPR on validation
  # at or below this target (false positives cost analyst time).
  benign_fpr_target: 0.01
  # Per-class weight = (n_largest / n_class) ** power, capped. 0 = unweighted,
  # 1 = inverse frequency. Chosen by the imbalance study.
  class_weight_power: 0.5
  max_class_weight: 1000
  # Retraining promotes a candidate only if a paired bootstrap over test flows puts the
  # macro-F1 gain over production above zero (95% interval): a one-flow win is noise.
  promotion_bootstrap: 2000
  promotion_alpha: 0.05
  # Calibrated attack-probability cut points for Low / Medium / High / Critical.
  severity_bands: [0.6, 0.8, 0.95]
  # Tuning budget per model family: whichever of the two limits is hit first.
  tune_trials: 30
  tune_timeout_minutes: 60
  # Tuned with `sentinel ids tune --sample full` (Optuna, validation macro-F1 under the
  # deployed decision rule); see reports/ids/tuning_*_full.json. Rounded; n_estimators
  # is a cap for early stopping. Dev-sample tuning (tuning_*_dev.json) is NOT used: rare
  # classes are ~10x over-represented there, which favoured settings that overfit them.
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.037
    num_leaves: 75
    min_child_samples: 107
    feature_fraction: 0.86
    bagging_fraction: 0.98
    lambda_l1: 0.0068
    lambda_l2: 0.71
    early_stopping_rounds: 100
    class_weight_power: 0.22
  xgboost:
    n_estimators: 2000
    learning_rate: 0.065
    max_depth: 4
    min_child_weight: 4.67
    subsample: 0.53
    colsample_bytree: 0.73
    reg_alpha: 0.00002
    reg_lambda: 0.0002
    early_stopping_rounds: 100
    class_weight_power: 0.18
  mlp:
    hidden: [256, 128, 64]
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 2048
    epochs: 30
    patience: 6
    # 0 = plain cross-entropy. The imbalance study (reports/ids/imbalance.md) found focal
    # loss (gamma=2) scored lower on validation macro-F1 than cross-entropy with sqrt weights.
    focal_gamma: 0.0

anomaly:
  # Share of benign validation flows allowed above the anomaly threshold. In the fused
  # detector this is extra benign FPR on top of the supervised model's.
  fpr_target: 0.01
  # Also reported, so the recall / false-alarm trade-off is visible.
  fpr_sweep: [0.001, 0.005, 0.01, 0.02]
  autoencoder:
    hidden: [64, 32]
    # Candidate code sizes; the one with the best validation ROC-AUC (benign vs known
    # attacks) is kept.
    bottleneck_sweep: [8, 12, 16]
    lr: 0.001
    weight_decay: 0.00001
    batch_size: 4096
    epochs: 30
    patience: 3
  iforest:
    n_estimators: 200
    max_samples: 256
    train_rows: 200000

phishing:
  raw_dir: data/raw/phishing_emails
  processed_dir: data/processed/phishing
  # Folder to upload to Kaggle as a private dataset (train/val/test parquet + metadata).
  kaggle_dir: kaggle/phishing-emails
  # Characters of body kept per email; far beyond the model's 256-token window, so no
  # signal is lost, while keeping the upload small.
  max_chars: 3000
  # Grouped, label-stratified split: 5 folds -> 3 train, 1 validation, 1 test.
  n_folds: 5
  # Output of the Kaggle notebook (notebooks/phishing_lora_kaggle.ipynb), unzipped.
  kaggle_output_dir: models/phishing/phishing_lora_output
  max_len: 256
  # Alert threshold = score exceeded by this share of legitimate VALIDATION emails.
  # At 0.5 the model flags ~4% of legitimate test mail; a 2% validation budget gives
  # ~0.3% on test while catching ~90% of malicious mail (reports/phishing/results.md).
  fpr_budget: 0.02
  # int8 quantization of the embedding table only: 2.1x smaller with no accuracy loss.
  # Quantizing every MatMul is 1.6x faster but costs 1-2 F1 points (benchmark report).
  quantization: embeddings
  # Emails scored per model in the before/after benchmark (CPU is ~8 emails/s).
  benchmark_emails: 1000
  # URL classifier (PhiUSIIL + Hannousse, raw URLs).
  url_raw_dir: data/raw/phishing_urls
  # At most this share of legitimate validation URLs flagged. Emails carry several links,
  # so the per-URL budget is tighter than the per-email one.
  url_fpr_budget: 0.01
  url_max_features: 50000
  # Links may add at most this much to the email false-alarm rate on validation.
  url_email_extra_fpr: 0.005

adversarial:
  # Attack flows (test split, caught by the deployed ensemble) sampled per family.
  per_family: 250
  # Feature-space L-inf budgets, in training standard deviations of each feature.
  eps: [0.1, 0.25, 0.5, 1.0, 2.0]
  pgd_iter: 20
  hsj_samples: 80
  hsj_max_iter: 10
  hsj_max_eval: 400
  # Problem-space grid: forward-payload padding fraction x timing stretch factor.
  pads: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
  delays: [1.0, 1.25, 1.5, 2.0, 3.0, 5.0, 10.0]
  budgets:
    low: [0.1, 1.5]
    medium: [0.5, 3.0]
    high: [1.0, 10.0]
  adv_train_eps: 0.5
  adv_train_steps: 5
  adv_train_epochs: 3
  adv_train_lr: 0.0003
  adv_train_per_class: 40000
  adv_train_benign: 150000
  # Share of benign validation flows the disagreement flag may send to review.
  review_budget: 0.01

copilot:
  llm:
    # Tried in order; LLM_PROVIDERS=ollama in .env switches to offline-only.
    providers: [gemini, ollama]
    gemini_model: gemini-3.5-flash-lite
    ollama_model: llama3.2:3b
    # Free-tier budget: set these to your limits at https://aistudio.google.com/rate-limit.
    gemini_rpm: 8
    gemini_rpd: 450
    # Evaluation judge: a different model from the generator.
    # Flash models allow only ~10 free requests/day on this key; Flash-Lite has room.
    judge_model: gemini-3.1-flash-lite
    judge_rpm: 5
    judge_rpd: 150
    cache_path: data/cache/llm.sqlite
  # Emails scored per kind when filling the alerts table; the flagged ones become alerts.
  email_sample: {phishing: 309, fraud: 300, spam: 300, legitimate: 300}
  related_window_minutes: 30
  # Development alert set (validation split, own database): tune here, never on test.
  dev_database: sentinel_dev
  # Frozen test alert set for evaluation (copy of the alert DB before streaming began).
  eval_database: sentinel_eval
  dev_email_sample: {phishing: 60, fraud: 60}
  n_techniques: 8   # retrieved ATT&CK candidates the LLM may choose from
  n_cves: 3
  behaviour:
    # Behaviour sentences go to the LLM and the facts block. Retrieval candidates from a
    # behaviour-only query did not help on the dev set (R@8 92.4% -> 89.5% with 3; mixing
    # them into the main query: R@1 84.8% -> 35.2%), so none are added.
    extra_candidates: 0
  # Re-ranker score a CVE needs to be offered (flow data rarely names a product).
  cve_min_score: 1.0
  guard:
    deepset_dir: data/raw/prompt_injections
    n_train: 4000   # synthetic documents per split, half with an embedded injection
    n_val: 1000
    n_test: 2000
    max_fpr: 0.01   # false alarms allowed on clean validation documents
    pairs: true     # also score adjacent sentence pairs (instructions split in two)
    train_deberta: true
    epochs: 2
    lr: 0.00003
    batch_size: 16
    max_len: 128
  severity:
    family_impact:
      PortScan: Medium
      BruteForce: Medium
      DoS: High
      DDoS: High
      WebAttack: High
      Bot: High
      Infiltration: Critical
      Unknown anomaly: Medium
      Phishing/Spam: Medium
    # Without evidence of success, recon and password guessing stay below Critical.
    family_cap: {PortScan: High, BruteForce: High}
    volume_high: 100
    url_malicious: 0.9
  # CIC-IDS2017 victim network (dataset documentation); most specific match wins.
  assets:
    - {cidr: 192.168.10.0/24, name: victim network workstation, criticality: medium}
    - {cidr: 192.168.10.50, name: Ubuntu 16 web server, criticality: critical}
    - {cidr: 192.168.10.51, name: Ubuntu 12 server, criticality: high}
    - {cidr: 192.168.10.3, name: Windows Server 2016 domain controller and DNS, criticality: critical}
    - {cidr: 205.174.165.0/24, name: attacker network (external), criticality: low}
    - {cidr: 172.16.0.1, name: firewall NAT address, criticality: medium}

stream:
  flows_topic: net.flows
  alerts_topic: alerts.new
  rate: 500          # replayer flows/s (0 = as fast as possible)
  max_batch: 500     # detector micro-batch: up to this many flows...
  max_wait_s: 0.2    # ...or this long, whichever comes first
  sample_rate: 0.05  # share of scored flows stored in `flows` for drift and retraining
  explain: true      # SHAP / anomaly reasons for alerts...
  max_explain: 50    # ...one per campaign (source, target, family) per batch, at most this many
  review: true       # Module 4 review flag: store member-disagreement flows as Low alerts
  detector_metrics_port: 9101
  replayer_metrics_port: 9102

mlops:
  interval_s: 60          # seconds between drift checks
  window_minutes: 10      # live flows (sampled) per check
  min_window_flows: 200   # skip a window with fewer flows
  reference_rows: 5000    # benign training flows in the reference
  method: psi
  feature_threshold: 0.1  # a feature drifts at PSI >= 0.1
  # Share of drifted features that triggers retraining. On the test split, normal traffic
  # scores 0-5% against the benign reference and attack-heavy windows 41-76%.
  drift_threshold: 0.2
  # Retrain when normal traffic drifts (benign = flows the model passed) or when the model
  # does worse on labelled live flows. A new attack mix the model still catches moves the
  # "all" window but is no reason to retrain (Module 6 drift demo: all 31%, benign 0%).
  trigger_window: benign  # all = any traffic change (retrains on attack campaigns too)
  min_attack_recall: 0.9  # share of labelled live attacks the model alerted on
  # Share of labelled live benign flows it alerted on (any alert, review flags included).
  # The fused detector is designed to send ~1-2% of normal traffic to an analyst (anomaly
  # threshold at 1% on validation, review flag ~1%); Friday's demo ran at 1.7%. Trigger at 2x.
  max_benign_fpr: 0.04
  min_labelled_flows: 100 # per class (attack / benign) before a performance check counts
  consecutive: 2          # checks in a row above the threshold
  cooldown_minutes: 60
  retrain_models: [lightgbm, mlp]
  min_live_rows: 500      # labelled live flows needed to retrain
  max_live_rows: 200000
  retrain_timeout_minutes: 120  # a "running" run older than this died with its process
  metrics_port: 9103
